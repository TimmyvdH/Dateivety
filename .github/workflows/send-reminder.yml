name: Send date-night reminder

# Bewust GEEN schedule — dit draait alleen als jij op "Run workflow" klikt
# (Actions-tab in GitHub) of via `gh workflow run send-reminder.yml`.
on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin
      - run: node scripts/send-reminder.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
